<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
 <defs>
  <linearGradient id="heart" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#ffb7d3"/><stop offset=".48" stop-color="#ff8fb9"/><stop offset="1" stop-color="#f66e9e"/></linearGradient>
  <linearGradient id="paper" x1="0" y1="0" x2="0.9" y2="1"><stop stop-color="#fffdfd"/><stop offset="1" stop-color="#fff0f6"/></linearGradient>
  <linearGradient id="bow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffb5d0"/><stop offset=".55" stop-color="#ff79aa"/><stop offset="1" stop-color="#ee5f96"/></linearGradient>
  <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffdce9"/><stop offset="1" stop-color="#f7c5df"/></linearGradient>
  <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#d95e8c" flood-opacity=".18"/></filter>
  <filter id="shine"><feGaussianBlur stdDeviation="1.5"/></filter>
 </defs>
 <rect width="512" height="512" fill="#fff"/>
 <!-- heart-shaped calendar outer shell -->
 <g filter="url(#shadow)">
