  <path d="M121 184 C135 156 160 157 181 166" fill="none" stroke="#ffe8f1" stroke-width="8" stroke-linecap="round" opacity=".85"/>
 </g>
 <!-- calendar date tiles -->
 <g stroke="#f8c6dc" stroke-width="1.5">
  <rect x="137" y="226" width="48" height="39" rx="10" fill="url(#tile)"/><rect x="194" y="226" width="48" height="39" rx="10" fill="url(#tile)"/><rect x="270" y="226" width="48" height="39" rx="10" fill="url(#tile)"/><rect x="327" y="226" width="48" height="39" rx="10" fill="url(#tile)"/>
  <rect x="137" y="273" width="48" height="39" rx="10" fill="url(#tile)"/><rect x="194" y="273" width="48" height="39" rx="10" fill="url(#tile)"/><rect x="270" y="273" width="48" height="39" rx="10" fill="url(#tile)"/><rect x="327" y="273" width="48" height="39" rx="10" fill="url(#tile)"/>
  <rect x="137" y="320" width="48" height="39" rx="10" fill="url(#tile)"/><rect x="194" y="320" width="48" height="39" rx="10" fill="url(#tile)"/><rect x="270" y="320" width="48" height="39" rx="10" fill="url(#tile)"/><rect x="327" y="320" width="48" height="39" rx="10" fill="url(#tile)"/>
  <rect x="194" y="273" width="48" height="39" rx="10" fill="#ff6f9f" stroke="#f65e94"/>
 </g>
 <path d="M218 284 C212 276 201 281 204 290 C206 297 218 305 218 305 C218 305 231 296 232 289 C233 280 222 276 218 284Z" fill="#fff"/>
 <!-- tiny hearts at sides -->
 <path d="M103 288 C97 280 87 285 91 294 C94 300 103 306 103 306 C103 306 113 299 114 292 C115 284 106 280 103 288Z" fill="#ff91b8" stroke="#ffd8e7" stroke-width="2"/>
 <path d="M409 289 C403 281 393 286 397 295 C400 301 409 307 409 307 C409 307 419 300 420 293 C421 285 412 281 409 289Z" fill="#ff91b8" stroke="#ffd8e7" stroke-width="2"/>
 <!-- large glossy bow -->
 <g filter="url(#shadow)" stroke="#ee699b" stroke-width="3.5" stroke-linejoin="round">
  <path d="M252 104 C224 64 173 54 150 76 C132 94 155 126 194 141 C214 149 235 138 252 119Z" fill="url(#bow)"/>
  <path d="M260 104 C288 64 339 54 362 76 C380 94 357 126 318 141 C298 149 277 138 260 119Z" fill="url(#bow)"/>
  <path d="M239 119 C219 133 199 153 203 170 C207 185 229 172 256 145Z" fill="url(#bow)"/>
